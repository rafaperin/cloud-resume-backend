name: Backend CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.13'

jobs:
  test:
    name: Test backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: |
          python -m coverage run \
            -m unittest discover \
            -s tests \
            -p 'test_*.py'
          python -m coverage report

  validate-infrastructure:
    name: Validate Bicep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Bicep CLI
        run: az bicep install

      - name: Build Bicep
        run: az bicep build --file infrastructure/main.bicep

      - name: Lint Bicep
        run: az bicep lint --file infrastructure/main.bicep

  deploy:
    name: Deploy backend
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - test
      - validate-infrastructure
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Bicep CLI
        run: az bicep install

      - name: Preview infrastructure changes
        env:
          DEPLOYER_PRINCIPAL_ID: ${{ secrets.DEPLOYER_PRINCIPAL_ID }}
          CUSTOM_DOMAIN_NAME: ${{ vars.CUSTOM_DOMAIN_NAME }}
          REGISTER_STORAGE_CUSTOM_DOMAIN: ${{ vars.REGISTER_STORAGE_CUSTOM_DOMAIN }}
        run: |
          az deployment sub what-if \
            --name "cloudresume-${GITHUB_RUN_ID}-whatif" \
            --location eastus2 \
            --template-file infrastructure/main.bicep \
            --parameters infrastructure/main.bicepparam \
            --output jsonc

      - name: Deploy infrastructure
        id: infrastructure
        shell: bash
        env:
          DEPLOYER_PRINCIPAL_ID: ${{ secrets.DEPLOYER_PRINCIPAL_ID }}
          CUSTOM_DOMAIN_NAME: ${{ vars.CUSTOM_DOMAIN_NAME }}
          REGISTER_STORAGE_CUSTOM_DOMAIN: ${{ vars.REGISTER_STORAGE_CUSTOM_DOMAIN }}
        run: |
          function_app_name=$(
            az deployment sub create \
              --name "cloudresume-${GITHUB_RUN_ID}" \
              --location eastus2 \
              --template-file infrastructure/main.bicep \
              --parameters infrastructure/main.bicepparam \
              --query 'properties.outputs.functionAppName.value' \
              --output tsv
          )
          echo "function_app_name=${function_app_name}" >> "$GITHUB_OUTPUT"

      - name: Deploy Azure Function
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ steps.infrastructure.outputs.function_app_name }}
          package: .
          remote-build: true
          respect-funcignore: true
